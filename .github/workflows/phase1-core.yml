name: Phase 1 core

on:
  pull_request:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/phase1-core.yml"
  push:
    branches:
      - main
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/phase1-core.yml"

permissions:
  contents: read

jobs:
  swift-core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run core tests
        run: swift test
      - name: Compile iOS platform target
        run: |
          xcodebuild \
            -scheme HTDTCapturePlatform \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/xcode-ios \
            CODE_SIGNING_ALLOWED=NO \
            build
