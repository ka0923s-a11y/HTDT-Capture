name: Accuracy benchmark

on:
  pull_request:
    paths:
      - "tools/accuracy_benchmark/**"
      - "samples/accuracy-benchmark/**"
      - "schemas/accuracy-benchmark-*.schema.json"
      - "docs/ACCURACY_VALIDATION_PROTOCOL.md"
      - ".github/workflows/accuracy-benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "tools/accuracy_benchmark/**"
      - "samples/accuracy-benchmark/**"
      - "schemas/accuracy-benchmark-*.schema.json"
      - "docs/ACCURACY_VALIDATION_PROTOCOL.md"
      - ".github/workflows/accuracy-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile benchmark tooling
        run: |
          python -m py_compile \
            tools/accuracy_benchmark/analyze.py \
            tools/accuracy_benchmark/test_analyze.py
      - name: Parse benchmark schemas and fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path("schemas/accuracy-benchmark-observations-v1.schema.json"),
              Path("schemas/accuracy-benchmark-ruleset-v1.schema.json"),
              Path("schemas/accuracy-benchmark-report-v1.schema.json"),
              Path("samples/accuracy-benchmark/synthetic-observations.json"),
              Path("samples/accuracy-benchmark/provisional-ruleset-v1.json"),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY
      - name: Run benchmark tests
        run: python -m unittest tools.accuracy_benchmark.test_analyze -v
      - name: Analyze synthetic fixture
        run: |
          python tools/accuracy_benchmark/analyze.py \
            samples/accuracy-benchmark/synthetic-observations.json \
            samples/accuracy-benchmark/provisional-ruleset-v1.json \
            --output /tmp/accuracy-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/accuracy-report.json").read_text())
          assert report["engineering_gate_status"] == "pass"
          assert all(gate["status"] == "pass" for gate in report["gates"])
          print(report["engineering_gate_status"])
          PY
